# Local dev profile — overrides production Neon config.
# Activate with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# Requires local Postgres (Postgres.app) with databases saatsaheli_dev / saatsaheli_test
# owned by user "saatsaheli", schema loaded from db/schema.sql.

spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/saatsaheli_dev
spring.datasource.username=saatsaheli
spring.datasource.password=

# Local Postgres has no autosuspend, so HikariCP can be smaller and less aggressive.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.keepalive-time=0

# Show SQL for debugging in dev only.
spring.jpa.show-sql=true

# Local dev isn't gated — support payments work for anyone while testing locally.
support.open-to-all=true

# Local dev: Stripe/email redirects must target the local frontend.
app.frontend-url=http://localhost:3000

# Never send real email from local dev, even though .env has live SMTP creds.
# Sends are logged instead (see EmailService). Set true only for deliberate mail testing.
app.email.enabled=false

# Dev catch-all: if MAIL_REDIRECT_TO is set in .env (comma-separated test inboxes),
# every email is redirected there (overrides the disable above) with the real
# recipient stamped into the subject. Leave MAIL_REDIRECT_TO unset for no email.
app.email.redirect-to=${MAIL_REDIRECT_TO:}

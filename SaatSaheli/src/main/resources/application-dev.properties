# Local dev profile — overrides production Neon config.
# Activate with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# Requires local Postgres (Postgres.app) with databases saatsaheli_dev / saatsaheli_test
# owned by user "saatsaheli", schema loaded from db/schema.sql.

spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/saatsaheli_dev
spring.datasource.username=saatsaheli
spring.datasource.password=

# Local Postgres has no autosuspend, so HikariCP can be smaller and less aggressive.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.keepalive-time=0

# Show SQL for debugging in dev only.
spring.jpa.show-sql=true

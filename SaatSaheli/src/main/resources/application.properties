spring.application.name=SaatSaheli
server.port=${PORT:8081}
# File uploads stored in Google Drive for persistence across deploys

# PostgreSQL (Neon) DataSource
spring.datasource.url=${NEON_DB_URL}
spring.datasource.username=${NEON_DB_USERNAME}
spring.datasource.password=${NEON_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Connection pool (HikariCP) — warm pool for paid Neon Launch + Render Starter (always-on).
# Neon autosuspend must be disabled in the Neon console, or keepalive pings will fight it.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1

# Query-level safety: kill any DB statement running longer than 5s.
# Prevents runaway/looping queries from holding a connection and driving Neon compute up.
# Note: Neon's pooler rejects startup `options=-c statement_timeout`, so we set it per-session
# via connection-init-sql instead. JPA hint is the client-side belt-and-suspenders.
spring.jpa.properties.jakarta.persistence.query.timeout=5000
spring.datasource.hikari.connection-init-sql=SET statement_timeout = 5000

# Google credentials (still needed for Drive uploads)
google.sheets.credentials-file=${GOOGLE_CREDENTIALS_FILE:}

# Google Drive Configuration (legacy, kept for reference)
google.drive.folder-id=${GOOGLE_DRIVE_FOLDER_ID:}

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Hugging Face AI Image Generation
huggingface.api.token=${HUGGINGFACE_API_TOKEN:}
huggingface.api.model=stabilityai/stable-diffusion-xl-base-1.0
huggingface.api.timeout=60000

# Jackson date format (match existing frontend format)
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT Configuration
jwt.secret=${JWT_SECRET:SaatSaheli_Default_Secret_Key_Change_In_Production_2026!}

# CORS — comma-separated allowed origins (set in .env for production)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}

# Mail (Gmail SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=${MAIL_FROM:avikaventures.info@gmail.com}

# Stripe Payment Configuration
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}

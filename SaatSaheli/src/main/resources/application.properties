spring.application.name=SaatSaheli
server.port=${PORT:8081}
# File uploads stored in Google Drive for persistence across deploys

# PostgreSQL (Neon) DataSource
spring.datasource.url=${NEON_DB_URL}
spring.datasource.username=${NEON_DB_USERNAME}
spring.datasource.password=${NEON_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
# Tomcat must swallow the full body so Spring can return a clean 413 instead of resetting the socket.
server.tomcat.max-swallow-size=100MB
server.tomcat.max-http-form-post-size=100MB

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Connection pool (HikariCP) — let Neon autosuspend. Launch plan meters compute hours,
# so a warm pool ($16+/mo) costs more than the ~300-500ms cold start it avoids.
# Neon "Scale to Zero" must be ON (5 min) for this to take effect.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1

# Query-level safety: kill any DB statement running longer than 5s.
# Prevents runaway/looping queries from holding a connection and driving Neon compute up.
# Note: Neon's pooler rejects startup `options=-c statement_timeout`, so we set it per-session
# via connection-init-sql instead. JPA hint is the client-side belt-and-suspenders.
spring.jpa.properties.jakarta.persistence.query.timeout=5000
spring.datasource.hikari.connection-init-sql=SET statement_timeout = 5000

# Google credentials (still needed for Drive uploads)
google.sheets.credentials-file=${GOOGLE_CREDENTIALS_FILE:}

# Google Drive Configuration (legacy, kept for reference)
google.drive.folder-id=${GOOGLE_DRIVE_FOLDER_ID:}

# Cloudflare R2 (S3-compatible) — sole media backend
r2.account-id=${R2_ACCOUNT_ID:}
r2.access-key-id=${R2_ACCESS_KEY_ID:}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
r2.bucket=${R2_BUCKET:}
r2.endpoint=${R2_ENDPOINT:}
r2.public-base-url=${R2_PUBLIC_BASE_URL:}

# File upload limits — keep in sync with the FrontEnd MAX_SIZE in Account.jsx

# Hugging Face AI Image Generation
huggingface.api.token=${HUGGINGFACE_API_TOKEN:}
# stabilityai/stable-diffusion-xl-base-1.0 was deprecated by HF Inference (410 Gone, 2026).
# FLUX.1-schnell is currently supported on hf-inference, free tier, 4-step distillation
# (fast: ~5-10s vs SDXL's 30s+). Same {"inputs":"<prompt>"} body shape, no code change.
# Override at runtime with HUGGINGFACE_API_MODEL env var if needed.
huggingface.api.model=${HUGGINGFACE_API_MODEL:black-forest-labs/FLUX.1-schnell}
huggingface.api.timeout=60000

# Jackson date format (match existing frontend format)
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT Configuration
jwt.secret=${JWT_SECRET:SaatSaheli_Default_Secret_Key_Change_In_Production_2026!}

# CORS — comma-separated allowed origins (set in .env for production)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}

# Mail (Gmail SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=${MAIL_FROM:avikaventures.info@gmail.com}

# Stripe Payment Configuration
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}

# Support/donation rollout gate. While open-to-all is false, only the test user
# (by email) can complete a support/sponsor payment; everyone else gets a 403.
# Flip SUPPORT_OPEN_TO_ALL=true to open it to all visitors (incl. anonymous).
support.open-to-all=${SUPPORT_OPEN_TO_ALL:false}
support.test-user-email=${SUPPORT_TEST_USER_EMAIL:chitra.shr@gmail.com}

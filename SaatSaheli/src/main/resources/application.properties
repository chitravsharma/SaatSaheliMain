spring.application.name=SaatSaheli
server.port=8081
# Static uploads served via resource handler in CorsConfig

# Disable JPA/DataSource auto-config (using Google Sheets instead)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration

# Google Sheets Configuration
google.sheets.credentials-file=${GOOGLE_CREDENTIALS_FILE}
google.sheets.spreadsheet-id=${GOOGLE_SHEETS_SPREADSHEET_ID}
google.sheets.application-name=SaatSaheli

# Google Drive Configuration
google.drive.folder-id=${GOOGLE_DRIVE_FOLDER_ID}

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Hugging Face AI Image Generation
huggingface.api.token=${HUGGINGFACE_API_TOKEN}
huggingface.api.model=stabilityai/stable-diffusion-xl-base-1.0
huggingface.api.timeout=60000

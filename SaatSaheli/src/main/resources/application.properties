spring.application.name=SaatSaheli
server.port=${PORT:8081}
# Static uploads served via resource handler in CorsConfig

# PostgreSQL (Neon) DataSource
spring.datasource.url=${NEON_DB_URL}
spring.datasource.username=${NEON_DB_USERNAME}
spring.datasource.password=${NEON_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000

# Google credentials (still needed for Drive uploads)
google.sheets.credentials-file=${GOOGLE_CREDENTIALS_FILE}

# Google Drive Configuration
google.drive.folder-id=${GOOGLE_DRIVE_FOLDER_ID}

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Hugging Face AI Image Generation
huggingface.api.token=${HUGGINGFACE_API_TOKEN}
huggingface.api.model=stabilityai/stable-diffusion-xl-base-1.0
huggingface.api.timeout=60000

# Jackson date format (match existing frontend format)
spring.jackson.serialization.write-dates-as-timestamps=false
